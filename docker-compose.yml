services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-db.postgres}
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=${DB_NAME:-db.postgres}
      - DB_USER=${DB_USER:-user}
      - DB_PASSWORD=${DB_PASSWORD:-mypassword}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      # Optional; optimizer runs without a key (neutral willingness) when unset.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5-mini-2025-08-07}
      - OPTIMIZER_SOLVER=${OPTIMIZER_SOLVER:-ipopt}
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app # mount source code
      - /app/node_modules # keep node_modules inside container
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true # required for hot reload in Docker
    depends_on:
      - backend

volumes:
  postgres_data:
